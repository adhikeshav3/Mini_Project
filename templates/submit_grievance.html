{% extends "base.html" %}

{% block title %}Submit Grievance{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 680px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold text-dark mb-0">Submit Grievance</h4>
        <a href="{{ url_for('student_dashboard') }}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
        </a>
    </div>

    <div class="card card-simple p-4 shadow-sm">
        <form method="POST" action="{{ url_for('submit_grievance') }}" enctype="multipart/form-data">
            <!-- Title -->
            <div class="mb-3">
                <label for="title" class="form-label fw-semibold text-dark small">Grievance Title <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="title" name="title" placeholder="e.g. Water cooler leaking on 2nd floor" required autofocus>
            </div>

            <!-- Description -->
            <div class="mb-3">
                <label for="description" class="form-label fw-semibold text-dark small">Description <span class="text-danger">*</span></label>
                <textarea class="form-control" id="description" name="description" rows="4" placeholder="Briefly describe what the problem is and where it is located..." required></textarea>
            </div>

            <!-- File Upload -->
            <div class="mb-4">
                <label for="attachment" class="form-label fw-semibold text-dark small">
                    Supporting Photo or Document <span class="text-muted fw-normal">(Optional)</span>
                </label>
                <input class="form-control form-control-sm" type="file" id="attachment" name="attachment" accept=".png,.jpg,.jpeg,.pdf">
            </div>

            <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                <a href="{{ url_for('student_dashboard') }}" class="btn btn-sm btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-portal px-4 py-2">
                    <i class="bi bi-send me-1"></i> Submit Grievance
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
